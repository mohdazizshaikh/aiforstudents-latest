name: Prototype checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Automated tests
        run: node --test tests/*.test.mjs
      - name: Build bilingual human-review worklist (not approval)
        run: npm run review-packet
      - name: Generate local-only supplemental review worklist and change baseline (NOT approval)
        run: |
          npm run review:snapshot
          npm run review:supplements
          npm run review:compare -- review-packet/change-snapshot.json
      - name: Build local grade-by-subject curriculum gap report (NOT verified coverage)
        run: npm run curriculum:plan -- --export curriculum-planning.json
      - name: Generate and validate three local curriculum review batches (NOT approval)
        run: |
          npm run curriculum:batches -- --index
          for id in cbse-001 cbse-002 maharashtra-001; do
            npm run curriculum:batches -- --template "$id" "$id.json"
            npm run curriculum:batches -- --check "$id.json"
          done
      - name: Reconcile local curriculum review progress (NOT approval)
        run: |
          npm run curriculum:progress -- --summary
          npm run curriculum:progress -- --summary cbse-001.json
          npm run curriculum:progress -- --require-all cbse-001.json cbse-002.json maharashtra-001.json
      - name: Reconcile local educational review progress (NOT approval)
        run: |
          npm run review:batches -- --template pilot-001 m81-pilot-local
          npm run review:progress -- --summary
          npm run review:progress -- --summary m81-pilot-local
          if npm run review:progress -- --require-all m81-pilot-local; then
            echo 'ERROR: incomplete batch collection accepted as complete'
            exit 1
          fi
      - name: Validate pending M23 review-evidence template (NOT human approval)
        run: |
          npm run review-evidence:template
          npm run review-evidence:check
      - name: Validate pending M26 safety handoff (NOT legal approval)
        run: |
          npm run safety-handoff:template
          npm run safety-handoff:check
      - name: Rehearse disabled tutor boundary across all canonical records (NOT provider evaluation)
        run: npm run tutor:audit-corpus
      - name: Exhaustive fictional mastery rule grid (NOT empirical validation)
        run: npm run mastery:audit-grid
      - name: Verify restricted staging checker with synthetic HTTP fixtures (NO live host)
        run: node --test tests/m87-restricted-staging-audit.test.mjs
      - name: Generate and validate private teacher rights handoff (no approvals)
        run: |
          npm run teacher:rights -- --template m89-ci-rights.json
          npm run teacher:rights -- --check m89-ci-rights.json
          rm review-evidence/m89-ci-rights.json
      - name: Assert public preflight remains blocked
        run: |
          if node tools/release-preflight.mjs --public > /dev/null; then
            echo 'ERROR: public child release gate was unexpectedly permitted'
            exit 1
          fi
      - name: Static semantic navigation audit (not WCAG certification)
        run: npm run audit-a11y
      - name: Check English/Hindi completeness across all learner draft modules (structural, not translation approval)
        run: npm run audit:bilingual
      - name: Verify 100-task status dashboard and owner/source/test traceability (NOT human approval)
        run: |
          npm run plan:check
          npm run plan:trace
          node tools/verify-evidence-snapshot.mjs --require-git
      - name: Audit all static offline dependencies and guide routes
        run: npm run audit:offline
      - name: Verify static release
        run: node tools/verify-static-release.mjs
      - name: Structural content audit
        run: node tools/audit-content.mjs

      - name: Private staging preflight (not public approval)
        run: node tools/release-preflight.mjs
      - name: Verify release ZIP integrity and static allowlist
        run: python3 tools/package-release.py
      - name: Ensure no private reviewer evidence or secrets in archives
        run: python3 tools/check-package-privacy.py
      - name: Prepare verified staging ZIP inside workflow workspace
        run: cp ../aiforstudents_hostinger_staging_m33.zip ./aiforstudents_hostinger_staging_m33.zip
      - name: Attach verified private-staging-only Hostinger ZIP (never auto-deploy)
        uses: actions/upload-artifact@v4
        with:
          name: m33-hostinger-private-staging-noindex
          path: aiforstudents_hostinger_staging_m33.zip
          if-no-files-found: error
          retention-days: 7

  browser-smoke:
    name: Local Chromium browser smoke (NOT live hosting)
    # Playwright 1.56 browser install is not supported on ubuntu-26.04 runner images.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test runtime
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: "Real browser: native modules, Hindi, privacy, keyboard, offline and print"
        run: python tests/browser_m25_ci.py
      - name: Upload smoke report (local test only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m33-local-browser-regression
          path: test-results/m33-browser/report.json
          if-no-files-found: warn
          retention-days: 7
