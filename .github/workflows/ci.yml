name: Prototype checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Automated tests
        run: node --test tests/*.test.mjs
      - name: Build bilingual human-review worklist (not approval)
        run: npm run review-packet
      - name: Validate pending M23 review-evidence template (NOT human approval)
        run: |
          npm run review-evidence:template
          npm run review-evidence:check
      - name: Validate pending M26 safety handoff (NOT legal approval)
        run: |
          npm run safety-handoff:template
          npm run safety-handoff:check
      - name: Assert public preflight remains blocked
        run: |
          if node tools/release-preflight.mjs --public > /dev/null; then
            echo 'ERROR: public child release gate was unexpectedly permitted'
            exit 1
          fi
      - name: Static semantic navigation audit (not WCAG certification)
        run: npm run audit-a11y
      - name: Check English/Hindi completeness across all learner draft modules (structural, not translation approval)
        run: npm run audit:bilingual
      - name: Verify 100-task status dashboard and owner/source/test traceability (NOT human approval)
        run: |
          npm run plan:check
          npm run plan:trace
      - name: Verify static release
        run: node tools/verify-static-release.mjs
      - name: Structural content audit
        run: node tools/audit-content.mjs

      - name: Private staging preflight (not public approval)
        run: node tools/release-preflight.mjs
      - name: Verify release ZIP integrity and static allowlist
        run: python3 tools/package-release.py
      - name: Ensure no private reviewer evidence or secrets in archives
        run: python3 tools/check-package-privacy.py
      - name: Prepare verified staging ZIP inside workflow workspace
        run: cp ../aiforstudents_hostinger_staging_m32.zip ./aiforstudents_hostinger_staging_m32.zip
      - name: Attach verified private-staging-only Hostinger ZIP (never auto-deploy)
        uses: actions/upload-artifact@v4
        with:
          name: m32-hostinger-private-staging-noindex
          path: aiforstudents_hostinger_staging_m32.zip
          if-no-files-found: error
          retention-days: 7

  browser-smoke:
    name: Local Chromium browser smoke (NOT live hosting)
    # Playwright 1.56 browser install is not supported on ubuntu-26.04 runner images.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test runtime
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: "Real browser: native modules, Hindi, privacy, keyboard, offline and print"
        run: python tests/browser_m25_ci.py
      - name: Upload smoke report (local test only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m32-local-browser-regression
          path: test-results/m32-browser/report.json
          if-no-files-found: warn
          retention-days: 7
